# FestPass Configuration
spring.application.name=festpass

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/festpass?createDatabaseIfNotExist=true
spring.datasource.username=festpass_user
spring.datasource.password=Festpass@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Prevent infinite recursion on bidirectional relationships
spring.jackson.serialization.fail-on-empty-beans=false
